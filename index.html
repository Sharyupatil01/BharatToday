<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News Application</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Dark Mode Toggle Button -->
<button class="toggle-btn" onclick="toggleDarkMode()">🌙 Dark Mode</button>

<!-- Navigation Bar -->
<nav>
    <div class="main-nav container flex">
        <a href="#" onclick="reload()" class="company-logo">
            <img src="./assests/bharat-today-high-resolution-logo-black-transparent.png" alt="logo Image">
        </a>
        <div class="nav-links">
            <ul class="flex">
                <li class="hover-link nav-item" id="IPL" onclick="onNavClick('IPL')">IPL</li>
                <li class="hover-link nav-item" id="finance" onclick="onNavClick('finance')">Finance</li>
                <li class="hover-link nav-item" id="education" onclick="onNavClick('education')">Education</li>
                <li class="hover-link nav-item" id="politics" onclick="onNavClick('politics')">Politics</li>
                <li class="hover-link nav-item" id="sports" onclick="onNavClick('sports')">Sports</li>
            </ul>
        </div>
        <div class="search-bar flex">
            <input type="text" class="news-input" id="search-input" placeholder="eg. Science">
            <button class="search-button" id="search-button">Search</button>
        </div>
    </div>
</nav>

<!-- Main Content -->
<main>
    <div class="card-container container flex" id="card-container"></div>
</main>

<!-- News Card Template -->
<template id="template-newcard">
    <div class="card">
        <div class="card-header">
            <img src="http://via.placeholder.com/400x200" alt="news-image" id="news-image">
        </div>
        <div class="card-content">
            <h3 id="news-title">Title</h3>
            <h6 class="news-source" id="new-source">Source & Date</h6>
            <p class="news-desc" id="news-desc">Description</p>
        </div>
    </div>
</template>

<script src="script.js"></script>
</body>
</html>
